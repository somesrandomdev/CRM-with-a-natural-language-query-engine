[project]
name = "clearpipe"
version = "0.1.0"
description = "Clearpipe: an AI-native CRM with a natural-language query compiler."
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "sqlalchemy>=2.0.30",
  "psycopg[binary]>=3.2",
  "alembic>=1.13",
  "pydantic>=2.7",
  "pydantic-settings>=2.3",
  "pyjwt>=2.8",
  "bcrypt>=4.1",
  "python-multipart>=0.0.9",
  "email-validator>=2.1",
  "sqlglot>=25",
  "anthropic>=0.40",
  "httpx>=0.27",
  "faker>=25",
]

[project.optional-dependencies]
dev = [
  "pytest>=8",
  "factory-boy>=3.3",
  "ruff>=0.5",
  "mypy>=1.10",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*", "nlquery*", "pipeline*", "scoring*", "llm*", "seed*", "evals*"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "C4", "RUF", "S", "ANN", "T20"]
ignore = ["B008", "S101", "ANN401"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S", "ANN", "RUF012"]
"alembic/**" = ["ANN"]
"seed/**" = ["S311"]
"seed/__main__.py" = ["T201"]
"evals/**" = ["T201", "S101"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]
ignore_missing_imports = true
exclude = ["alembic/", "tests/"]
