services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: clearpipe
      POSTGRES_PASSWORD: clearpipe
      POSTGRES_DB: clearpipe
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U clearpipe -d clearpipe"]
      interval: 3s
      timeout: 3s
      retries: 20

  api:
    build: .
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql+psycopg://clearpipe:clearpipe@db:5432/clearpipe
      JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET in .env (see .env.example)}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      LLM_BACKEND: ${LLM_BACKEND:-anthropic}
    ports:
      - "8000:8000"

volumes:
  pgdata:
